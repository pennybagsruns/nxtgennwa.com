<style>
  /* Layout: the photo is the whole page, edge to edge. A few words sit in the sky at the top left,
     held legible by a dark grey scrim; the cars keep the rest of the frame. Single dark look. */
  :root {
    color-scheme: dark;
    --ground: #1d1f23;       /* dark graphite grey: page ground and scrim colour */
    --cloud: #ffffff;        /* primary type */
    --haze: #dde1e7;         /* secondary type, cool grey */
    --ink: #0b0c0e;          /* button text */
    /* the ground colour at fixed strengths, for the scrim behind the words */
    --scrim-strong: rgba(29, 31, 35, 0.90);
    --scrim-mid: rgba(29, 31, 35, 0.66);
    --scrim-soft: rgba(29, 31, 35, 0.30);
    --scrim-foot: rgba(29, 31, 35, 0.64);
    --scrim-none: rgba(29, 31, 35, 0);

    --display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
    --body: "Archivo", "Helvetica Neue", Arial, sans-serif;

    --gutter: clamp(20px, 5vw, 72px);
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  html {
    background: var(--ground);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--cloud);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .page {
    position: relative;
    isolation: isolate;
    overflow: hidden;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 56px;
    /* side gutter, widened where a phone's notch or rounded corners need more */
    padding-left: max(var(--gutter), env(safe-area-inset-left, 0px));
    padding-right: max(var(--gutter), env(safe-area-inset-right, 0px));
    --pad-top: clamp(40px, 9vh, 104px);
    padding-top: var(--pad-top);
    padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  }

  /* ---------- photo, edge to edge ---------- */
  .bg {
    position: absolute;
    top: 0;
    left: 0;
    z-index: -2;
    width: 100%;
    /* tall screens: overscan so the cars sit below the words. Short phone screens (a small iPhone,
       or Instagram's in-app browser) overscan more, capped so the wheels stay in frame. */
    height: 116%;
    height: max(116%, min(880px, 149% - 60px));
    max-width: none;
    object-fit: cover;
    object-position: 82% 46%;
  }
  @media (min-aspect-ratio: 1/1) {
    .bg { height: 100%; }
  }
  .page::before {
    content: "";
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: -1;
    /* tall screens: scrim falls from the top; a little weight at the foot for the small print */
    background:
      linear-gradient(to top, var(--scrim-foot) 0, var(--scrim-none) 16%),
      linear-gradient(to bottom, var(--scrim-strong) 0, var(--scrim-mid) 30%, var(--scrim-none) 62%);
  }
  @media (min-aspect-ratio: 1/1) {
    .page::before {
      /* wide screens: scrim pools in the top-left corner behind the words, leaving the cars clear */
      background:
        linear-gradient(to top, var(--scrim-foot) 0, var(--scrim-none) 14%),
        radial-gradient(ellipse 78% 92% at 0% 0%,
          var(--scrim-strong) 0, var(--scrim-mid) 40%, var(--scrim-soft) 72%, var(--scrim-none) 100%);
    }
  }

  /* ---------- words ---------- */
  .lead {
    container-type: inline-size;
    width: 100%;
    max-width: 35rem;
    min-width: 0;
  }
  .lead-inner {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: clamp(16px, 2.4vh, 24px);
  }

  .wordmark {
    margin: 0 0 0 -0.04em;   /* italic overhang sits inside the gutter */
    font-family: var(--display);
    font-stretch: 125%;
    font-variation-settings: "wdth" 125;
    font-weight: 800;
    font-style: italic;
    font-size: clamp(3.25rem, 17vw, 7rem);      /* older phones without container units */
    font-size: clamp(3.25rem, 20cqi, 8.5rem);
    line-height: 0.86;
    letter-spacing: -0.035em;
    white-space: nowrap;
  }

  .tagline {
    margin: 0;
    max-width: 24ch;
    font-family: var(--display);
    font-stretch: 112%;
    font-variation-settings: "wdth" 112;
    font-weight: 600;
    font-size: clamp(1.2rem, 4.6vw, 1.625rem);
    font-size: clamp(1.2rem, 5.2cqi, 1.625rem);
    line-height: 1.2;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .copy {
    margin: 0;
    font-size: 1rem;
    font-size: clamp(0.975rem, 3.9cqi, 1.0625rem);
    line-height: 1.5;
    color: var(--haze);
    text-wrap: balance;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin-top: 8px;
    padding: 15px 20px 15px 22px;
    background: var(--cloud);
    color: var(--ink);
    font-family: var(--display);
    font-stretch: 112%;
    font-variation-settings: "wdth" 112;
    font-weight: 700;
    font-size: 0.9375rem;
    letter-spacing: 0.01em;
    text-decoration: none;
    border-radius: 3px;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transition: background-color 0.18s ease, transform 0.18s ease;
  }
  .cta svg { width: 14px; height: 14px; transition: transform 0.18s ease; }
  .cta:hover { background: var(--haze); }
  .cta:hover svg { transform: translate(2px, -2px); }
  .cta:active { transform: translateY(1px); }
  .cta:focus-visible { outline: 2px solid var(--cloud); outline-offset: 4px; }

  .fine {
    margin: 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--cloud);
  }

  /* a short upright phone screen: pull the words up a little so they clear the cars */
  @media (max-height: 620px) and (max-aspect-ratio: 1/1) {
    .page { --pad-top: 28px; gap: 24px; }
    .lead-inner { gap: 12px; }
    .cta { margin-top: 4px; }
  }

  /* a phone turned sideways: little height, so everything tightens up */
  @media (max-height: 500px) {
    .page { gap: 20px; --pad-top: 22px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
    .lead { max-width: 21rem; }
    .lead-inner { gap: 12px; }
    .cta { padding-block: 12px; margin-top: 2px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cta, .cta svg { transition: none; }
  }
</style>

<style>
  /* fill the visible screen on phones, whatever the browser's toolbars are doing */
  .page {

<main class="page">
  <img class="bg" src="nxtgen-hero.jpg" alt="A row of performance cars parked under a blue Arkansas sky, seen from behind at ground level." width="1932" height="2576" decoding="async" fetchpriority="high">

  <div class="lead">
    <div class="lead-inner">
      <h1 class="wordmark">nxt gen</h1>
      <p class="tagline">The next generation of motorsport enthusiasts in Northwest Arkansas.</p>
      <p class="copy">Something big is in the works. More coming soon.</p>
      <a class="cta" id="instagram-link" href="https://www.instagram.com/nxt_gen_nwa/" target="_blank" rel="noopener">
        Follow us on Instagram
        <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M3 11 11 3M4.5 3H11v6.5"/></svg>
      </a>
    </div>
  </div>

  <p class="fine">&copy; 2026 nxt gen</p>
</main>
</body>
